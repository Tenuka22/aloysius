# Production stack, as deployed on the College's server.
#
# - Secrets are not in this file: `infisical-sync` exports the `prod`
#   environment from Infisical into the `aloysius_secrets` volume, and `minio`
#   and `web` source `/secrets/app.env` at start. Set INFISICAL_PROJECT_ID,
#   IDENTITY_CLIENT_ID and IDENTITY_CLIENT_SECRET (and INFISICAL_DOMAIN if it is
#   not https://secrets.aloysiuscollege.lk) in the deploy environment.
# - `web` and `building` carry the Watchtower label, so a new `latest` image
#   in registry.gitlab.com/tenuka22/aloysius-web is pulled and redeployed
#   within the 300s poll interval. The registry login is read from
#   /root/.docker/config.json on the host.
# - Every published port is bound to 127.0.0.1 (3001-3005); a reverse proxy on
#   the host is what exposes the site.
# - `web` applies pending Drizzle migrations before it starts the server.
#
# `docker-compose.yml` (no `.prod`) is for local development.

services:
  watchtower:
    image: nickfedor/watchtower:1.19.0
    restart: unless-stopped
    environment:
      TZ: Asia/Colombo
      DOCKER_CONFIG: /
      WATCHTOWER_LABEL_ENABLE: "true"
      WATCHTOWER_POLL_INTERVAL: "300"
      WATCHTOWER_CLEANUP: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /root/.docker/config.json:/config.json:ro

  infisical-sync:
    image: alpine:3.20
    container_name: aloysius-web-infisical-sync-1
    restart: "no"
    environment:
      INFISICAL_DOMAIN: ${INFISICAL_DOMAIN:-https://secrets.aloysiuscollege.lk}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:?INFISICAL_PROJECT_ID is required}
      IDENTITY_CLIENT_ID: ${IDENTITY_CLIENT_ID:?IDENTITY_CLIENT_ID is required}
      IDENTITY_CLIENT_SECRET: ${IDENTITY_CLIENT_SECRET:?IDENTITY_CLIENT_SECRET is required}
    volumes:
      - aloysius_secrets:/secrets
    entrypoint:
      - sh
      - -c
      - |
        set -eu
        apk add --no-cache bash wget >/dev/null
        wget -qO- 'https://artifacts-cli.infisical.com/setup.apk.sh' | sh >/dev/null
        apk add --no-cache infisical >/dev/null
        TOKEN=$$(infisical login --method=universal-auth \
          --client-id="$$IDENTITY_CLIENT_ID" --client-secret="$$IDENTITY_CLIENT_SECRET" \
          --plain --silent)
        export INFISICAL_TOKEN="$$TOKEN"
        infisical sm export --projectId="$$INFISICAL_PROJECT_ID" --env=prod \
          --format=dotenv > /secrets/app.env.tmp
        chmod 644 /secrets/app.env.tmp
        mv /secrets/app.env.tmp /secrets/app.env
        echo "secrets synced"

  minio:
    image: pgsty/silo:latest
    container_name: aloysius-web-minio-1
    restart: unless-stopped
    depends_on:
      infisical-sync:
        condition: service_completed_successfully
    entrypoint:
      - sh
      - -c
      - >-
        set -a && . /secrets/app.env && set +a &&
        export MINIO_ROOT_USER="$$MINIO_ACCESS_KEY" MINIO_ROOT_PASSWORD="$$MINIO_SECRET_KEY" &&
        exec /usr/bin/silo server /data --console-address ":9001"
    ports:
      - "127.0.0.1:3001:9000"
      - "127.0.0.1:3002:9001"
    volumes:
      - aloysius_minio_data:/data
      - aloysius_secrets:/secrets:ro

  turso-db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    container_name: aloysius-web-turso-db-1
    restart: unless-stopped
    user: root
    environment:
      SQLD_NODE: primary
      SQLD_HTTP_LISTEN_ADDR: 0.0.0.0:8080
    ports:
      - "127.0.0.1:3003:8080"
    volumes:
      - aloysius_turso_data:/var/lib/sqld

  web:
    image: registry.gitlab.com/tenuka22/aloysius-web/aloysius-web:latest
    container_name: aloysius-web-web-1
    restart: unless-stopped
    command:
      - sh
      - -c
      - set -a && . /secrets/app.env && set +a && node /app/packages/db/scripts/migrate-deploy.mjs && exec node --run start
    depends_on:
      infisical-sync:
        condition: service_completed_successfully
      minio:
        condition: service_started
      turso-db:
        condition: service_started
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 4000
      TURSO_DATABASE_URL: http://turso-db:8080
      TURSO_AUTH_TOKEN: ""
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: aloysius
      ADMIN_USERNAME: admin
      CMS_USERNAME: cms
      BETTER_AUTH_URL: https://aloysiuscollege.lk
    labels:
      com.centurylinklabs.watchtower.enable: "true"
    ports:
      - "127.0.0.1:3004:4000"
    volumes:
      - aloysius_secrets:/secrets:ro

  building:
    image: registry.gitlab.com/tenuka22/aloysius-web/aloysius-building:latest
    container_name: aloysius-web-building-1
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4004
    ports:
      - "127.0.0.1:3005:4004"
    labels:
      com.centurylinklabs.watchtower.enable: "true"

volumes:
  aloysius_minio_data:
  aloysius_turso_data:
  aloysius_secrets:
