name: aloysius

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    ports:
      - "${WEB_PORT:-4000}:${WEB_PORT:-4000}"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      PORT: ${WEB_PORT:-4000}
      NODE_ENV: production
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4000}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-http://turso-db:8080}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-aloysius}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    depends_on:
      turso-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${WEB_PORT:-4000}/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  turso-db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    ports:
      - "${LIBSQL_PORT:-8080}:8080"
    environment:
      SQLD_NODE: primary
    volumes:
      - turso_data:/var/lib/sqld
    healthcheck:
      # The sqld image ships no curl/wget - just bash and coreutils - so this
      # checks the HTTP port accepts TCP connections via bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: pgsty/silo:latest
    # Published on the loopback only, on MinIO's own ports 9000/9001.
    #
    # These are NOT the even 4000-range numbers the app services use, and that
    # is deliberate on two counts: 4001 is the dev server's port (so a running
    # `bun run dev` and this stack can coexist), and 4002 is `building`'s. The
    # old dev compose file existed solely to dodge that collision; keeping these
    # on 9000/9001 lets one file serve both the full stack and `dev:infra`.
    #
    # Loopback because the console can delete every object in the bucket -
    # `0.0.0.0` would put it on the LAN every time this ran on a tethered
    # connection. Override with MINIO_API_PORT/MINIO_CONSOLE_PORT if you need
    # to reach it from another machine. The `web` container always reaches it
    # internally as `minio:9000`, regardless of these.
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  building:
    build:
      context: .
      dockerfile: apps/building/Dockerfile
    image: aloysius-building:latest
    init: true
    ports:
      - "${BUILDING_PORT:-4002}:${BUILDING_PORT:-4002}"
    environment:
      PORT: ${BUILDING_PORT:-4002}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:${BUILDING_PORT:-4002}/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  turso_data:
  minio_data:
