name: aloysius

services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    init: true
    ports:
      - "${WEB_PORT:-3001}:${WEB_PORT:-3001}"
    env_file:
      - path: apps/web/.env
        required: false
    environment:
      PORT: ${WEB_PORT:-3001}
      NODE_ENV: production
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:3001}
      TURSO_DATABASE_URL: ${TURSO_DATABASE_URL:-http://turso-db:8080}
      TURSO_AUTH_TOKEN: ${TURSO_AUTH_TOKEN:-}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-aloysius}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
    depends_on:
      turso-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:${WEB_PORT:-3001}/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  turso-db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    ports:
      - "${LIBSQL_PORT:-8080}:8080"
    environment:
      SQLD_NODE: primary
    volumes:
      - turso_data:/var/lib/sqld
    healthcheck:
      # The sqld image ships no curl/wget - just bash and coreutils - so this
      # checks the HTTP port accepts TCP connections via bash's /dev/tcp.
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:latest
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  building:
    build:
      context: .
      dockerfile: apps/building/Dockerfile
    image: aloysius-building:latest
    init: true
    ports:
      - "${BUILDING_PORT:-4001}:${BUILDING_PORT:-4001}"
    environment:
      PORT: ${BUILDING_PORT:-4001}
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "fetch('http://localhost:${BUILDING_PORT:-4001}/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  turso_data:
  minio_data:
