name: CI

# Mirrors ../school-management/.github/workflows/ci.yml: lint, a database job
# (migrate from zero, typecheck, test) and the production build, run on
# every push and PR into master. Same job names and shape; the database
# itself differs because this repo's is libSQL, not PostgreSQL. A fourth
# job, `docker`, has no equivalent there: it builds both of this repo's two
# Dockerfiles (apps/web, apps/building) with `push: false` - a build-only
# smoke test, proving the images GitHub Actions deploys from actually build,
# without publishing anywhere.
#
# - `services.postgres` there becomes `services.turso-db` here - same
#   pattern (a real server, migrated from zero, not an embedded file), using
#   the same image and healthcheck `docker-compose.dev.yml` already runs.
# - There is no MinIO service container: GitHub Actions service containers
#   cannot override a container's command, and MinIO's image needs
#   `server /data --console-address ":9001"` to start - it has no plain
#   default CMD that works. Not needed either: every test file was checked,
#   and none of them talk to object storage over the network
#   (packages/storage's test only checks the returned shape).
# - There is no `db:verify-migrations`/`db:check-drift` pair -
#   school-management's own schema-snapshot-drift tooling is specific to its
#   Drizzle+PostgreSQL setup and has no equivalent here yet. Migrating a
#   fresh `turso-db` from zero (this workflow's "Migrate" step) is the part
#   of that gate this repo already has.
#
# There is deliberately no auto-fix job, for the same reason
# school-management's does not have one: it would run on every push with
# `contents: write` and push bot commits to any branch, master included.
# Run `bun run fix` locally; CI only reports.
#
# A fifth job, `publish`, also has no equivalent there: school-management
# publishes its image to Docker Hub by hand. This repo's images are pushed
# to a GitLab Container Registry project instead, over a deploy token held
# in GitHub secrets - see the job for why.

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - master

permissions:
  contents: read

# Placeholder values for the Varlock schema, which `bun install`'s postinstall
# codegen and the Vite build both validate. Validation values only: nothing
# here is a deployment secret.
env:
  NODE_ENV: test
  BETTER_AUTH_SECRET: ci-placeholder-secret-not-used-at-runtime-0000
  BETTER_AUTH_URL: http://localhost:3000
  TURSO_DATABASE_URL: http://localhost:8080
  CMS_USERNAME: cms
  CMS_PASSWORD: ci-placeholder-cms-12345678
  MINIO_ENDPOINT: localhost
  MINIO_PORT: 9000
  MINIO_ACCESS_KEY: minioadmin
  MINIO_SECRET_KEY: minioadmin
  MINIO_BUCKET: aloysius
  MINIO_USE_SSL: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Lint and format (ultracite)
        run: bun run check

  database:
    runs-on: ubuntu-latest
    services:
      turso-db:
        image: ghcr.io/tursodatabase/libsql-server:latest
        env:
          SQLD_NODE: primary
        ports:
          - 8080:8080
        options: >-
          --health-cmd "bash -c 'echo > /dev/tcp/127.0.0.1/8080'" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Migrate an empty database from zero
        working-directory: packages/db
        run: bun run db:migrate
      - name: Typecheck every package and app
        run: bun run check-types
      - name: Unit and integration tests
        run: bun run test

  build:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: Production build and web typecheck
        working-directory: apps/web
        run: bun run check-types

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build the placeholder (building) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/building/Dockerfile
          push: false
          cache-from: type=gha,scope=building
          cache-to: type=gha,mode=max,scope=building

  # Publishes the images docker-compose.prod.yml deploys. Gated on a version
  # tag (v*) rather than every push to master, same way a release is cut
  # elsewhere: it builds the two Dockerfiles once more (buildx cache from
  # the `docker` job above makes this cheap) and pushes to this repo's
  # GitLab Container Registry project (there is no GitLab CI here - the
  # registry just happens to live on GitLab) using a deploy token stored as
  # the `GITLAB_REGISTRY_USER`/`GITLAB_REGISTRY_TOKEN` repo secrets.
  publish:
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    needs: [lint, database, build, docker]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to the GitLab Container Registry
        uses: docker/login-action@v3
        with:
          registry: registry.gitlab.com
          username: ${{ secrets.GITLAB_REGISTRY_USER }}
          password: ${{ secrets.GITLAB_REGISTRY_TOKEN }}
      - name: Push the web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            registry.gitlab.com/tenuka22/aloysius/aloysius-web:${{ github.ref_name }}
            registry.gitlab.com/tenuka22/aloysius/aloysius-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Push the placeholder (building) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/building/Dockerfile
          push: true
          tags: |
            registry.gitlab.com/tenuka22/aloysius/aloysius-building:${{ github.ref_name }}
            registry.gitlab.com/tenuka22/aloysius/aloysius-building:latest
          cache-from: type=gha,scope=building
          cache-to: type=gha,mode=max,scope=building
