name: aloysius-dev

services:
  turso-db:
    image: ghcr.io/tursodatabase/libsql-server:latest
    ports:
      - "8080:8080"
    environment:
      SQLD_NODE: primary
    volumes:
      - dev_turso_data:/var/lib/sqld
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/127.0.0.1/8080"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  minio:
    image: pgsty/silo:latest
    # Loopback only. The dev web server runs on the host and has to reach
    # `localhost:9000`, but nothing else on the network should be able to -
    # `0.0.0.0:9000` would put the console on the LAN every time somebody ran
    # this on a shared or tethered connection. Production publishes neither
    # port at all; see the note in docker-compose.yml.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - dev_minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  dev_turso_data:
  dev_minio_data:
